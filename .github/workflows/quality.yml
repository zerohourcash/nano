name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/quality.sh
  android-rust-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/everyday/package-lock.json
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install Android NDK and cargo-ndk
        run: |
          sdkmanager "ndk;27.2.12479018"
          cargo install cargo-ndk --locked
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build PWA assets
        working-directory: apps/everyday
        run: npm ci && npm run build:web
      - name: Build autonomous Android debug APK
        working-directory: apps/everyday
        run: gradle -p android assembleDebug
      - name: Verify Rust libraries and APK
        working-directory: apps/everyday
        run: |
          test -s android/app/src/main/jniLibs/arm64-v8a/libmeshkeeper_node.so
          test -s android/app/src/main/jniLibs/x86_64/libmeshkeeper_node.so
          test -s android/app/build/outputs/apk/debug/app-debug.apk
