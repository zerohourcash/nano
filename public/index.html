<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/style.css"><title>Nano Склад</title></head>
<body><header><h1>Nano Склад</h1><span id="net">локальная нода</span></header><main>
<section class="stats"><div><b id="available">0</b><small>свободно</small></div><div><b id="out">0</b><small>выдано</small></div><div><b id="peers">0</b><small>соседей</small></div></section>
<nav><button data-tab="assets" class="active">Оборудование</button><button data-tab="people">Сотрудники</button><button data-tab="add">Добавить</button></nav>
<section id="assets" class="tab"><div class="row"><input id="search" placeholder="Поиск по названию или серийному номеру"><button id="scan">Сканировать QR</button></div><div id="assetList"></div></section>
<section id="people" class="tab hidden"><div id="peopleList"></div><h2>Обмен без сети</h2><p class="meta">Пакет содержит только публичные ключи и подписанные операции. Закрытый ключ не экспортируется.</p><div class="row"><button id="export">Скачать пакет</button><button id="importBtn">Импортировать</button><input type="file" id="importFile" accept="application/json" hidden></div></section>
<section id="add" class="tab hidden"><form id="assetForm"><h2>Новое оборудование</h2><input name="name" required placeholder="Название"><input name="serial" placeholder="Серийный номер"><input name="location" placeholder="Место хранения"><button>Добавить предмет</button></form><form id="personForm"><h2>Новый сотрудник</h2><input name="name" required placeholder="Имя"><button>Добавить сотрудника</button></form></section>
</main><dialog id="action"><form method="dialog"><h2 id="dialogTitle"></h2><select id="holder"></select><input id="location" placeholder="Место возврата"><div class="row"><button value="cancel" class="secondary">Отмена</button><button id="confirm" value="default">Подтвердить</button></div></form></dialog><div id="toast"></div><script type="module" src="/app.js"></script></body></html>
