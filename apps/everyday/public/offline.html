<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5E629B" />
    <title>Everyday — нет связи</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        color: #252638; background: #f6f6fb;
        font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(100%, 420px); padding: 32px; background: white; border: 1px solid #e5e5ef; border-radius: 24px; box-shadow: 0 12px 40px rgb(37 38 56 / 9%); }
      img { width: 150px; height: auto; }
      h1 { margin: 24px 0 8px; font-size: 24px; }
      p { margin: 0 0 24px; color: #68697b; }
      .retry { display: inline-block; border-radius: 12px; padding: 12px 18px; color: white; background: #5e629b; font-weight: 650; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="Everyday" />
      <h1>Сейчас нет связи</h1>
      <p>Интерфейс Everyday остаётся доступен. Для загрузки данных и выполнения операций подключитесь к локальному узлу или интернету.</p>
      <a class="retry" href="">Повторить</a>
    </main>
  </body>
</html>
