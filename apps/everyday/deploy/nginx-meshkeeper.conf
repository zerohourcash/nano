# MeshKeeper — публикация центрального сервера через HTTPS.
#
# Узел слушает только 127.0.0.1:8080 и сам TLS не терминирует. Сессия живёт в
# cookie с флагом Secure, поэтому без HTTPS вход работать не будет.
#
# Сертификат: certbot --nginx -d meshkeeper.example.com

server {
    listen 80;
    listen [::]:80;
    server_name meshkeeper.example.com;

    # ACME-проверка certbot и безусловный редирект на HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name meshkeeper.example.com;

    ssl_certificate     /etc/letsencrypt/live/meshkeeper.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meshkeeper.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Фотографии предметов уезжают в базу как data-URL, поэтому запросы крупные.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Узел сверяет Origin с Host: подменять Host нельзя, иначе все мутации
        # начнут отлетать с 403.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # Обмен с локальными узлами. Защищён общим токеном, но полезно ограничить
    # доступ по IP, если адреса офисов известны.
    location /sync/ {
        # allow 203.0.113.0/24;
        # deny all;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}
